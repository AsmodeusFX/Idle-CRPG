const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const c of [...new Set(events.map(e=>e.Category))]){const o=document.createElement('option');o.value=c;o.textContent=c;cat.appendChild(o)}
const fields=[['EventId','事件ID'],['Act','适用章节'],['Region','推荐区域'],['Origin','原型来源'],['Template','功能模板'],['Priority','候选级别'],['Interaction','自动触发'],['Outcome','结果/奖励'],['Status','状态']];
function openDetail(e){document.getElementById('detailbody').innerHTML='<h2>'+esc(e.Name)+'</h2>'+fields.map(([f,label])=>'<div class="field"><b>'+label+'</b><p>'+esc(e[f])+'</p></div>').join('');shade.classList.add('active');details.classList.add('active');}
function close(){shade.classList.remove('active');details.classList.remove('active')};
shade.onclick=close;document.getElementById('close').onclick=close;window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function draw(){const search=q.value.trim().toLocaleLowerCase();const arr=events.filter(e=>(!act.value||e.Act===act.value)&&(!cat.value||e.Category===cat.value)&&(!pri.value||e.Priority===pri.value)&&(!search||Object.values(e).join(' ').toLocaleLowerCase().includes(search)));
document.getElementById('count').textContent='共找到 '+arr.length+' 条候选事件（可点击卡片查看详细规则）';
list.innerHTML='';for(const e of arr){const el=document.createElement('article');el.className='card';el.tabIndex=0;el.innerHTML='<div class="small">'+esc(e.EventId)+'</div><h3>'+esc(e.Name)+'</h3><span class="chip">'+esc(e.Act)+'</span><span class="chip">'+esc(e.Category)+'</span><span class="chip pri">'+esc(e.Priority)+'</span><div class="desc">'+esc(e.Interaction)+'</div><div class="small">'+esc(e.Outcome)+'</div>';el.onclick=()=>openDetail(e);el.onkeydown=ev=>{if(ev.key==='Enter')openDetail(e)};list.appendChild(el)}}
[q,act,cat,pri].forEach(el=>el.addEventListener('input',draw));draw();
</script></body></html>
